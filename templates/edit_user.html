<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Edit User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Edit User
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    name="fullname"
                    class="form-control"
                    value="{{ user.FullName }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ user.Email }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Role
                </label>

                <select
                    name="role"
                    class="form-select">

                    <option value="Admin"
                    {% if user.Role=="Admin" %}selected{% endif %}>
                    Admin
                    </option>

                    <option value="Support"
                    {% if user.Role=="Support" %}selected{% endif %}>
                    Support
                    </option>

                    <option value="Employee"
                    {% if user.Role=="Employee" %}selected{% endif %}>
                    Employee
                    </option>

                </select>

            </div>

            <button class="btn btn-primary">
                Update User
            </button>

            <a href="/users" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
